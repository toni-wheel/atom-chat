version: "3.7"
services:
  db:
    image: postgres:17
    container_name: atom-chat_db
    env_file:
      - .env
    ports:
      - 5432:5432

  api:
    build:
      context: .
    volumes:
      - "C:/Users/anton/Desktop/Проекты/atom-chat/api:/fastapi:cached"
    container_name: atom-chat_api
    ports:
      - 8000:8000
    depends_on:
      - db
